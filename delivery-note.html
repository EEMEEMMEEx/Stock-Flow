<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบนำส่งอุปกรณ์ — Forth Corporation</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --bg: #f4f1ec;
            --fg: #1a1a1a;
            --muted: #6b6560;
            --accent: #c0392b;
            --accent-light: #e74c3c;
            --card: #ffffff;
            --border: #d5d0c8;
            --header-bg: #1a1a1a;
            --header-fg: #f4f1ec;
            --ems-tag: #2980b9;
            --office-tag: #27ae60;
            --sub-item-bg: #faf8f5;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
            --radius: 10px;
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'IBM Plex Sans Thai', 'Sarabun', sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* ===== พื้นหลังลวดลาย ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(192,57,43,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(41,128,185,0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== Header ===== */
        .doc-header {
            background: var(--header-bg);
            color: var(--header-fg);
            padding: 2rem 0;
            position: relative;
            overflow: hidden;
        }
        .doc-header::before {
            content: '';
            position: absolute;
            top: -50%; right: -10%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(192,57,43,0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: headerGlow 6s ease-in-out infinite alternate;
        }
        @keyframes headerGlow {
            0% { transform: scale(1) translate(0,0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(-30px, 20px); opacity: 1; }
        }
        .doc-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--ems-tag), var(--office-tag), var(--accent));
            background-size: 300% 100%;
            animation: borderShift 4s linear infinite;
        }
        @keyframes borderShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }
        .doc-title {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }
        .doc-ref {
            font-size: 0.9rem;
            color: rgba(244,241,236,0.6);
            font-weight: 300;
        }
        .doc-badge {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.3rem 1rem;
            background: var(--accent);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 50px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* ===== Container ===== */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            position: relative;
            z-index: 1;
        }

        /* ===== Company Card ===== */
        .company-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 1.75rem 2rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent);
            animation: fadeSlideUp 0.5s ease-out both;
        }
        .company-name-th {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--fg);
        }
        .company-name-en {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .company-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem 2rem;
            font-size: 0.88rem;
            color: var(--muted);
        }
        .company-details i {
            width: 20px;
            color: var(--accent);
            font-size: 0.8rem;
        }
        .detail-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        /* ===== Info Row (Sender / Recipient) ===== */
        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .info-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 1.25rem 1.5rem;
            border-top: 3px solid var(--border);
            animation: fadeSlideUp 0.5s ease-out both;
        }
        .info-card:nth-child(1) { animation-delay: 0.1s; border-top-color: var(--office-tag); }
        .info-card:nth-child(2) { animation-delay: 0.15s; border-top-color: var(--ems-tag); }
        .info-card-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }
        .info-card-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--fg);
        }
        .info-card-sub {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        /* ===== Summary Bar ===== */
        .summary-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            animation: fadeSlideUp 0.5s ease-out 0.2s both;
        }
        .summary-chip {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--card);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            font-size: 0.85rem;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: default;
        }
        .summary-chip:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .summary-chip i {
            font-size: 0.9rem;
        }
        .chip-total i { color: var(--accent); }
        .chip-ems i { color: var(--ems-tag); }
        .chip-office i { color: var(--office-tag); }
        .summary-chip .chip-num {
            font-weight: 700;
            font-size: 1rem;
        }

        /* ===== Table ===== */
        .table-wrapper {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            animation: fadeSlideUp 0.5s ease-out 0.25s both;
        }
        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .table-toolbar-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .table-toolbar-title i { color: var(--accent); }
        .filter-btns {
            display: flex;
            gap: 0.4rem;
        }
        .filter-btn {
            padding: 0.35rem 0.85rem;
            border: 1.5px solid var(--border);
            background: transparent;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: var(--muted);
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead th {
            background: #faf8f5;
            padding: 0.75rem 1rem;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            text-align: left;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        thead th:first-child { padding-left: 1.5rem; width: 60px; }
        thead th:nth-child(2) { width: auto; }
        thead th:nth-child(3) { width: 90px; text-align: center; }
        thead th:nth-child(4) { width: 140px; text-align: center; }
        thead th:last-child { padding-right: 1.5rem; width: 160px; }

        tbody tr {
            border-bottom: 1px solid rgba(213,208,200,0.5);
            transition: background 0.15s;
            animation: rowFadeIn 0.4s ease-out both;
        }
        tbody tr:hover { background: rgba(192,57,43,0.03); }
        tbody tr.hidden-row { display: none; }

        tbody td {
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            vertical-align: top;
        }
        tbody td:first-child { padding-left: 1.5rem; font-weight: 600; color: var(--muted); font-size: 0.85rem; }
        tbody td:last-child { padding-right: 1.5rem; }

        .item-desc {
            font-weight: 500;
            color: var(--fg);
        }
        .item-qty {
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
        }
        .delivery-tag {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .tag-ems {
            background: rgba(41,128,185,0.1);
            color: var(--ems-tag);
        }
        .tag-office {
            background: rgba(39,174,96,0.1);
            color: var(--office-tag);
        }

        /* รายการย่อย (Sub-items) */
        .sub-items {
            margin-top: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: var(--sub-item-bg);
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }
        .sub-item {
            font-size: 0.82rem;
            color: var(--muted);
            padding: 0.15rem 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .sub-item::before {
            content: '';
            width: 5px; height: 5px;
            background: var(--accent);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .serial-cell {
            font-size: 0.82rem;
            color: var(--muted);
            font-family: 'IBM Plex Mono', monospace;
        }

        /* ===== Remark ===== */
        .remark-section {
            margin-top: 1.5rem;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 1.25rem 1.5rem;
            animation: fadeSlideUp 0.5s ease-out 0.35s both;
        }
        .remark-label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        .remark-value {
            font-size: 0.9rem;
            color: var(--fg);
            font-style: italic;
        }

        /* ===== Footer ===== */
        .doc-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.78rem;
            color: var(--muted);
            opacity: 0.6;
        }

        /* ===== Print Button ===== */
        .print-float {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
        }
        .print-btn {
            width: 52px; height: 52px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(192,57,43,0.35);
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .print-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(192,57,43,0.45);
        }
        .print-btn:active {
            transform: scale(0.95);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 200;
            background: var(--header-bg);
            color: var(--header-fg);
            padding: 0.85rem 1.5rem;
            border-radius: var(--radius);
            font-size: 0.88rem;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .toast.show { transform: translateX(0); }
        .toast i { color: var(--accent-light); }

        /* ===== Loading State ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            font-size: 0.9rem;
            color: var(--muted);
        }

        /* ===== Error State ===== */
        .error-state {
            text-align: center;
            padding: 4rem 2rem;
        }
        .error-state i {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        .error-state h2 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }
        .error-state p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .retry-btn {
            padding: 0.6rem 1.5rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .retry-btn:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        /* ===== Animations ===== */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes rowFadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .company-details { grid-template-columns: 1fr; }
            .info-row { grid-template-columns: 1fr; }
            .summary-bar { flex-direction: column; }
            .table-toolbar { flex-direction: column; gap: 0.75rem; align-items: flex-start; }
            thead th:nth-child(5),
            tbody td:last-child { display: none; }
            .doc-title { font-size: 1.35rem; }
        }

        /* ===== Print ===== */
        @media print {
            body { background: #fff; }
            body::before { display: none; }
            .doc-header { background: #1a1a1a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-float, .filter-btns, .toast, .loading-overlay { display: none !important; }
            .company-card, .info-card, .table-wrapper, .remark-section { box-shadow: none; border: 1px solid #ddd; }
            .table-wrapper { overflow: visible; }
        }

        /* ===== ลดการเคลื่อนไหว ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- หน้าจอโหลด -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">กำลังโหลดข้อมูลจาก XML...</div>
    </div>

    <!-- Toast แจ้งเตือน -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMsg">โหลดข้อมูลสำเร็จ</span>
    </div>

    <!-- Header -->
    <header class="doc-header">
        <div class="header-inner">
            <div class="doc-title" id="docTitle">ใบนำส่งอุปกรณ์</div>
            <div class="doc-ref" id="docRef">เอกสารอ้างอิง: —</div>
            <div class="doc-badge" id="docBadge">ต้นฉบับ</div>
        </div>
    </header>

    <!-- เนื้อหาหลัก -->
    <main class="container" id="mainContent" style="display:none;">

        <!-- ข้อมูลบริษัท -->
        <section class="company-card" id="companyCard" aria-label="ข้อมูลบริษัท">
            <div class="company-name-th" id="companyNameTH"></div>
            <div class="company-name-en" id="companyNameEN"></div>
            <div class="company-details" id="companyDetails"></div>
        </section>

        <!-- ผู้ส่ง / ผู้รับ -->
        <section class="info-row" aria-label="ผู้ส่งและผู้รับ">
            <div class="info-card">
                <div class="info-card-label"><i class="fas fa-paper-plane"></i> ผู้ส่งของ</div>
                <div class="info-card-value" id="senderName">—</div>
                <div class="info-card-sub" id="senderPhone"></div>
            </div>
            <div class="info-card">
                <div class="info-card-label"><i class="fas fa-inbox"></i> ผู้รับของ</div>
                <div class="info-card-value" id="recipientName">—</div>
                <div class="info-card-sub" id="recipientPhone"></div>
                <div class="info-card-sub" id="recipientDate"></div>
            </div>
        </section>

        <!-- สรุปจำนวน -->
        <div class="summary-bar" id="summaryBar" aria-label="สรุปจำนวนรวม">
            <div class="summary-chip chip-total">
                <i class="fas fa-boxes-stacked"></i>
                รวมทั้งหมด <span class="chip-num" id="totalItems">0</span> รายการ
            </div>
            <div class="summary-chip chip-ems">
                <i class="fas fa-truck-fast"></i>
                EMS <span class="chip-num" id="emsCount">0</span> รายการ
            </div>
            <div class="summary-chip chip-office">
                <i class="fas fa-building"></i>
                Office <span class="chip-num" id="officeCount">0</span> รายการ
            </div>
        </div>

        <!-- ตารางรายการ -->
        <section class="table-wrapper" aria-label="รายการอุปกรณ์">
            <div class="table-toolbar">
                <div class="table-toolbar-title">
                    <i class="fas fa-list-check"></i> รายการอุปกรณ์
                </div>
                <div class="filter-btns">
                    <button class="filter-btn active" data-filter="all" aria-label="แสดงทั้งหมด">ทั้งหมด</button>
                    <button class="filter-btn" data-filter="ems" aria-label="แสดงเฉพาะ EMS">EMS</button>
                    <button class="filter-btn" data-filter="office" aria-label="แสดงเฉพาะ Office">Office</button>
                </div>
            </div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ลำดับ</th>
                            <th>รายการ</th>
                            <th>จำนวน</th>
                            <th>ส่งที่</th>
                            <th>S/N / P/N</th>
                        </tr>
                    </thead>
                    <tbody id="itemTableBody"></tbody>
                </table>
            </div>
        </section>

        <!-- หมายเหตุ -->
        <section class="remark-section" id="remarkSection" aria-label="หมายเหตุ">
            <div class="remark-label"><i class="fas fa-message"></i> หมายเหตุ (Remark)</div>
            <div class="remark-value" id="remarkValue">—</div>
        </section>

        <footer class="doc-footer">
            เอกสารฉบับนี้จัดทำโดยระบบอัตโนมัติจากไฟล์ XML — Forth Corporation PCL.
        </footer>
    </main>

    <!-- ปุ่มพิมพ์ -->
    <div class="print-float">
        <button class="print-btn" id="printBtn" type="button" aria-label="พิมพ์เอกสาร" title="พิมพ์เอกสาร">
            <i class="fas fa-print"></i>
        </button>
    </div>

    <script>
        // ===== ฟังก์ชันแสดง Toast =====
        function showToast(msg, duration) {
            duration = duration || 3000;
            var toast = document.getElementById('toast');
            var toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, duration);
        }

        // ===== ฟังก์ชันพิมพ์เอกสาร =====
        function printDocument() {
            try {
                window.print();
            } catch (e) {
                // สำรอง: สร้าง iframe สำหรับพิมพ์
                var content = document.getElementById('mainContent');
                if (!content) return;
                var iframe = document.createElement('iframe');
                iframe.style.position = 'fixed';
                iframe.style.left = '-9999px';
                iframe.style.top = '-9999px';
                iframe.style.width = '0';
                iframe.style.height = '0';

        // ===== ผูก Event ปุ่มพิมพ์ =====
        document.getElementById('printBtn').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            printDocument();
        });

        // ===== ฟังก์ชันแสดง Error =====
        function showError(message) {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('mainContent').innerHTML = ''
                + '<div class="error-state">'
                + '<i class="fas fa-triangle-exclamation"></i>'
                + '<h2>ไม่สามารถโหลดข้อมูลได้</h2>'
                + '<p>' + message + '</p>'
                + '<button class="retry-btn" onclick="location.reload()">'
                + '<i class="fas fa-rotate-right"></i> ลองใหม่'
                + '</button>'
                + '</div>';
            document.getElementById('mainContent').style.display = 'block';
        }

        // ===== ฟังก์ชันดึงข้อมูลจาก XML =====
        function getText(node, tag) {
            if (!node) return '';
            var el = node.getElementsByTagName(tag)[0];
            return el ? el.textContent.trim() : '';
        }

        // ===== ฟังก์ชันหลัก: โหลดและแสดงผล XML =====
        function loadXML() {
            fetch('delivery-note.xml')
                .then(function(response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status + ': ไม่พบไฟล์ delivery-note.xml');
                    return response.text();
                })
                .then(function(xmlStr) {
                    var parser = new DOMParser();
                    var xmlDoc = parser.parseFromString(xmlStr, 'application/xml');

                    var parseError = xmlDoc.querySelector('parsererror');
                    if (parseError) throw new Error('ไฟล์ XML มีรูปแบบไม่ถูกต้อง');

                    renderDocument(xmlDoc);
                })
                .catch(function(err) {
                    console.warn('Fetch XML ล้มเหลว:', err.message);
                    renderFromEmbedded();
                });
        }

        // ===== ฟังก์ชัน Render จาก XML Document =====
        function renderDocument(xmlDoc) {
            var root = xmlDoc.documentElement;

            var title = getText(root, 'Title');
            var ref = getText(root, 'Reference');
            var docType = getText(root, 'DocumentType');

            document.getElementById('docTitle').textContent = title || 'ใบนำส่งอุปกรณ์';
            document.getElementById('docRef').textContent = ref ? 'เอกสารอ้างอิง: ' + ref : 'เอกสารอ้างอิง: —';
            document.getElementById('docBadge').textContent = docType || 'ต้นฉบับ';

            var company = root.getElementsByTagName('Company')[0];
            document.getElementById('companyNameTH').textContent = getText(company, 'NameTH');
            document.getElementById('companyNameEN').textContent = getText(company, 'NameEN');

            var detailsArr = [
                { icon: 'fa-location-dot', text: getText(company, 'AddressTH') },
                { icon: 'fa-phone', text: getText(company, 'TelInternational') || getText(company, 'Tel') },
                { icon: 'fa-fax', text: getText(company, 'Fax') },
                { icon: 'fa-file-invoice', text: 'เลขประจำตัวผู้เสียภาษี: ' + getText(company, 'TaxID') }
            ];
            var detailsHTML = '';
            for (var d = 0; d < detailsArr.length; d++) {
                detailsHTML += '<div class="detail-row"><i class="fas ' + detailsArr[d].icon + '"></i><span>' + detailsArr[d].text + '</span></div>';
            }
            document.getElementById('companyDetails').innerHTML = detailsHTML;

            var sender = root.getElementsByTagName('Sender')[0];
            var recipient = root.getElementsByTagName('Recipient')[0];

            document.getElementById('senderName').textContent = getText(sender, 'Name') || '—';
            document.getElementById('senderPhone').textContent = getText(sender, 'Phone') ? 'โทร: ' + getText(sender, 'Phone') : '';

            document.getElementById('recipientName').textContent = getText(recipient, 'Name') || '—';
            document.getElementById('recipientPhone').textContent = getText(recipient, 'Phone') ? 'โทร: ' + getText(recipient, 'Phone') : '';
            document.getElementById('recipientDate').textContent = getText(recipient, 'Date') ? 'วันที่: ' + getText(recipient, 'Date') : '';

            var items = root.getElementsByTagName('Item');
            renderItems(items);

            var remark = getText(root, 'Remark');
            document.getElementById('remarkValue').textContent = remark || '—';

            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('mainContent').style.display = 'block';
            showToast('โหลดข้อมูลสำเร็จ — ' + items.length + ' รายการ');
        }

        // ===== ฟังก์ชัน Render รายการอุปกรณ์ =====
        function renderItems(items) {
            var tbody = document.getElementById('itemTableBody');
            var emsCount = 0, officeCount = 0;

            var html = '';
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var no = getText(item, 'No');
                var desc = getText(item, 'Description');
                var qty = parseInt(getText(item, 'Quantity')) || 0;
                var unit = getText(item, 'Unit');
                var deliveryTo = getText(item, 'DeliveryTo');
                var serial = getText(item, 'SerialNumber');
                var partNum = getText(item, 'PartNumber');

                var isEMS = deliveryTo.toLowerCase().indexOf('ems') !== -1;
                if (isEMS) emsCount++; else officeCount++;

                var tagClass = isEMS ? 'tag-ems' : 'tag-office';
                var tagLabel = isEMS ? 'EMS' : 'Office';

                var subHTML = '';
                var subItems = item.getElementsByTagName('SubItem');
                if (subItems.length > 0) {
                    subHTML = '<div class="sub-items">';
                    for (var j = 0; j < subItems.length; j++) {
                        subHTML += '<div class="sub-item">' + subItems[j].textContent.trim() + '</div>';
                    }
                    subHTML += '</div>';
                }

                var serialPart = [serial, partNum].filter(Boolean).join(' / ');

                html += '<tr data-delivery="' + (isEMS ? 'ems' : 'office') + '" style="animation-delay: ' + (i * 0.05) + 's">'
                    + '<td>' + no + '</td>'
                    + '<td><div class="item-desc">' + desc + '</div>' + subHTML + '</td>'
                    + '<td class="item-qty">' + qty + ' <span style="font-size:0.75rem;font-weight:400;color:var(--muted)">' + unit + '</span></td>'
                    + '<td style="text-align:center"><span class="delivery-tag ' + tagClass + '">' + tagLabel + '</span></td>'
                    + '<td class="serial-cell">' + (serialPart || '—') + '</td>'
                    + '</tr>';
            }

            tbody.innerHTML = html;
            document.getElementById('totalItems').textContent = items.length;
            document.getElementById('emsCount').textContent = emsCount;
            document.getElementById('officeCount').textContent = officeCount;
        }

        // ===== ระบบ Filter =====
        document.addEventListener('click', function(e) {
            if (!e.target.classList.contains('filter-btn')) return;
            var filter = e.target.getAttribute('data-filter');

            var btns = document.querySelectorAll('.filter-btn');
            for (var b = 0; b < btns.length; b++) {
                btns[b].classList.remove('active');
            }
            e.target.classList.add('active');

            var rows = document.querySelectorAll('#itemTableBody tr');
            for (var r = 0; r < rows.length; r++) {
                if (filter === 'all') {
                    rows[r].classList.remove('hidden-row');
                } else {
                    if (rows[r].getAttribute('data-delivery') !== filter) {
                        rows[r].classList.add('hidden-row');
                    } else {
                        rows[r].classList.remove('hidden-row');
                    }
                }
            }
        });

        // ===== เริ่มต้น =====
        document.addEventListener('DOMContentLoaded', loadXML);
    </script>
