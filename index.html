<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <title>Stock Flow App</title>
    <script>
      (function () {
        var savedTheme = localStorage.getItem('stock-flow-theme-v2');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light');

        // Prevent third-party browser extension content script disconnection errors from polluting the console
        window.addEventListener('error', function (event) {
          if (event && event.message && event.message.includes("Cannot read properties of undefined (reading 'onMessage')")) {
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/30">
    <div id="root"></div>
    <script type="module">
      import { Buffer } from 'https://esm.sh/buffer';
      window.Buffer = Buffer;
      window.global = window;
      window.process = window.process || { env: { NODE_ENV: import.meta.env?.MODE || 'production' } };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
