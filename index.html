<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Stock Flow App</title>
    <script>
      (function () {
        var savedTheme = localStorage.getItem('stock-flow-theme-v2');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light');

        // Prevent third-party browser extension content script disconnection errors from polluting the console
        window.addEventListener('error', function (event) {
          if (event && event.message && event.message.includes("Cannot read properties of undefined (reading 'onMessage')")) {
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/30">
    <div id="root"></div>
    <script type="module">
      import { Buffer } from 'https://esm.sh/buffer';
      window.Buffer = Buffer;
      window.global = window;
      window.process = { env: { NODE_ENV: 'development' } };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
